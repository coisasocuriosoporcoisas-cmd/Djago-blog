{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <link href="{% static 'css/blog.css' %}" rel="stylesheet">
</head>
<body>
  {% if messages %}
  <div class="messages" style="margin: 20px 0;">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }}" style="padding: 15px; background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; border-radius: 4px; margin-bottom: 10px;">
        <strong>{{ message.tags|title }}:</strong> {{ message }}
      </div>
    {% endfor %}
  </div>
{% endif %}
   <div id="content">
    {% block content %}
    {% endblock %}
  </div>
  <div id="sidebar">
    <h2>Meu Blog Django</h2>
    
    <p>Esse é meu blog</p>
  </div>
</body>
</html>
