<form action="{% url 'blog:post_comment' post.id %}" method="post" class="comment-form">
    {% csrf_token %}
    <div class="left">{{ form.name.as_field_group }}</div>
    <div class="left">{{ form.email.as_field_group }}</div>
    <div class="body">{{ form.body.as_field_group }}</div>
    <p><input type="submit" value="Add comment"></p>
</form>
